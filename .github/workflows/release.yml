name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.arch }} DMG
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media runtime
        run: brew install ffmpeg

      - name: Test runtime packaging
        run: npm run test:runtime

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build and publish DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SevenMediaStudio ${{ github.ref_name }}
          releaseBody: |
            修复桌面版视频和音频无法压缩的问题：安装包现已包含 FFmpeg、FFprobe 及完整运行依赖，无需另外安装 Homebrew。
            失败提示会显示具体原因，便于定位文件或引擎问题。

            macOS 安装包：
            - Apple Silicon: aarch64 DMG
            - Intel: x86_64 DMG

            安装或更新：
            1. 完全退出正在运行的 SevenMediaStudio。
            2. 打开对应芯片的 DMG，将 SevenMediaStudio 拖入 Applications（应用程序），覆盖旧版本。
            3. 从 Applications 重新打开应用。

            本版本使用 ad-hoc 签名，尚未经过 Apple 公证。首次打开可能需要按 macOS「系统设置 → 隐私与安全性」中的提示允许打开。详见 https://support.apple.com/102445 。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles dmg

      - name: Verify bundled video engine
        env:
          RUNTIME_DIR: src-tauri/target/${{ matrix.target }}/release/bundle/macos/SevenMediaStudio.app/Contents/Resources/runtime
        run: |
          "$RUNTIME_DIR/ffmpeg" -v error -y -f lavfi -i testsrc2=size=320x180:rate=24 -t 1 -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/seven-media-smoke.mp4"
          "$RUNTIME_DIR/ffprobe" -v error -show_entries format=duration -of default=nw=1:nk=1 "$RUNNER_TEMP/seven-media-smoke.mp4"

  publish:
    name: Publish verified installers
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish both architectures together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for arch in aarch64 x64; do
            expected="SevenMediaStudio_${RELEASE_TAG#v}_${arch}.dmg"
            gh release view "$RELEASE_TAG" --json assets --jq '.assets' | jq -e --arg name "$expected" 'any(.[]; .name == $name and .size > 0)'
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest
