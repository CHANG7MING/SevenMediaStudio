name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media runtime
        run: brew install ffmpeg

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build and publish DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SevenMediaStudio ${{ github.ref_name }}
          releaseBody: |
            macOS 安装包：
            - Apple Silicon: aarch64 DMG
            - Intel: x86_64 DMG
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles dmg
