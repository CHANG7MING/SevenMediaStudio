name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media runtime
        run: brew install ffmpeg

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build and publish DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SevenMediaStudio ${{ github.ref_name }}
          releaseBody: |
            macOS 安装包：
            - Apple Silicon: aarch64 DMG
            - Intel: x86_64 DMG

            首次安装：
            1. 打开 DMG，将 SevenMediaStudio 拖入 Applications（应用程序）。
            2. 在 Applications 中右键 SevenMediaStudio，选择“打开”。
            3. 在系统提示中再次点击“打开”。以后可以直接双击启动。

            本版本使用 ad-hoc 签名，不需要终端命令。请勿直接双击首次启动；如果安装过旧版本，请先用本 Release 中的新版本覆盖。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles dmg
